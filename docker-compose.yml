version: "3.8"

services:
  agendador-tarefas:
    build: ..\agendador-tarefas
    container_name: agendador-tarefas
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/db_agendador
    depends_on:
      - mongodb

  bff-agendador-tarefas:
    build: .
    container_name: bff-agendador-tarefas
    ports:
      - "8083:8083"
    environment:
      usuario.url: usuario:8080/usuario
      agendador-tarefas.url: agendador-tarefas:8081/tarefas
      notificacao.url: notificacao:8084/email
    depends_on:
      - usuario
      - agendador-tarefas
      - notificacao

  usuario:
    build: ..\usuario
    container_name: usuario
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_usuario
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      - postgres

  notificacao:
    build: ..\notificacao
    container_name: notificacao
    ports:
      - "8084:8084"

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: db_usuario
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: no
    environment:
      MONGO_INITDB_DATABASE: db_agendador
    ports:
      - "27017:27017"

networks:
  default:
    driver: bridge
